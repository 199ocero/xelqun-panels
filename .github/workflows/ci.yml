name: CI

on:
    push:
        branches: [main]
    pull_request:

jobs:
    php:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                php: ['8.4', '8.5']
        name: PHP ${{ matrix.php }}
        steps:
            - uses: actions/checkout@v4
            - uses: shivammathur/setup-php@v2
              with:
                  php-version: ${{ matrix.php }}
                  extensions: gd, intl, sqlite3, pdo_sqlite
                  coverage: none
            # shortcut: tests against main because panels needs unreleased forms and tables. Drop this once they're tagged.
            - run: composer require xelqun/forms:dev-main xelqun/tables:dev-main --no-update --no-interaction
            - run: composer install --no-interaction --prefer-dist
            - run: vendor/bin/pint --test
            - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G
            - run: vendor/bin/pest

    js:
        runs-on: ubuntu-latest
        name: Vue / TypeScript
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 22
            - run: npm ci
            # shortcut: the same as the Composer step above. Drop this once forms and tables are published.
            - run: npm install --no-save github:199ocero/xelqun-forms#main github:199ocero/xelqun-tables#main
            - run: npx vp check
            - run: npx vue-tsc --noEmit
            - run: npx vp test
