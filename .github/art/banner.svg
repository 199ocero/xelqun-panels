<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Xelqun Panels: a PHP panel definition rendered as an admin panel">
  <defs>
    <radialGradient id="glow" cx="72%" cy="50%" r="62%">
      <stop offset="0" stop-color="#414fd2" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#414fd2" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#f4f5f8" fill-opacity="0.07"/>
    </pattern>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="812" x2="866" y1="200" y2="200">
      <stop offset="0" stop-color="#778ffa" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#778ffa"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1280" height="400" fill="#0e0f13"/>
  <rect width="1280" height="400" fill="url(#glow)"/>
  <rect width="1280" height="400" fill="url(#dots)"/>

  <!-- Wordmark -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="68" y="172" fill="#f4f5f8" font-size="56" font-weight="700" letter-spacing="-1.5">Xelqun</text>
    <text x="68" y="232" fill="#778ffa" font-size="56" font-weight="700" letter-spacing="-1.5">Panels</text>
    <text x="70" y="276" fill="#aeb3c2" font-size="20">Write it in PHP. Render it in Vue.</text>
  </g>

  <!-- PHP definition -->
  <g filter="url(#shadow)">
    <rect x="432" y="104" width="372" height="192" rx="14" fill="#171922" stroke="#2b2f3d"/>
  </g>
  <g fill="#3a3f50">
    <circle cx="456" cy="128" r="5"/>
    <circle cx="474" cy="128" r="5"/>
    <circle cx="492" cy="128" r="5"/>
  </g>
  <text x="780" y="133" text-anchor="end" fill="#7d8396" font-family="Menlo, Monaco, monospace" font-size="13">AdminPanelProvider.php</text>
  <g font-family="Menlo, Monaco, monospace" font-size="19">
    <text x="456" y="182"><tspan fill="#778ffa">$panel</tspan></text>
    <text x="484" y="216"><tspan fill="#aeb3c2">-&gt;</tspan><tspan fill="#f4f5f8">login</tspan><tspan fill="#aeb3c2">()</tspan></text>
    <text x="484" y="250"><tspan fill="#aeb3c2">-&gt;</tspan><tspan fill="#f4f5f8">resources</tspan><tspan fill="#aeb3c2">([</tspan><tspan fill="#8fd6b4">Product</tspan><tspan fill="#aeb3c2">]);</tspan></text>
  </g>

  <!-- Flow from definition to rendered panel -->
  <path d="M812 200 H862" fill="none" stroke="url(#link)" stroke-width="3" stroke-linecap="round"/>
  <path d="M858 191 L868 200 L858 209" fill="none" stroke="#778ffa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Rendered panel -->
  <g filter="url(#shadow)">
    <rect x="880" y="88" width="332" height="224" rx="14" fill="#f4f5f8"/>
  </g>
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif">
    <!-- Sidebar -->
    <path d="M894 88 H976 V312 H894 a14 14 0 0 1 -14 -14 V102 a14 14 0 0 1 14 -14 Z" fill="#e7e9f0"/>
    <rect x="892" y="102" width="18" height="18" rx="5" fill="#414fd2"/>
    <text x="917" y="116" fill="#1a1b23" font-size="14" font-weight="700">Acme</text>
    <rect x="888" y="134" width="80" height="28" rx="8" fill="#d5d9e4"/>
    <text x="898" y="153" fill="#1a1b23" font-size="13" font-weight="600">Home</text>
    <text x="898" y="187" fill="#5b6072" font-size="13">Orders</text>
    <text x="898" y="217" fill="#5b6072" font-size="13">Products</text>
    <text x="898" y="247" fill="#5b6072" font-size="13">Users</text>
    <!-- Stats -->
    <rect x="990" y="102" width="102" height="72" rx="10" fill="#ffffff" stroke="#dcdfe8"/>
    <text x="1002" y="124" fill="#5b6072" font-size="12">Orders</text>
    <text x="1002" y="156" fill="#1a1b23" font-size="23" font-weight="700">128</text>
    <rect x="1100" y="102" width="98" height="72" rx="10" fill="#ffffff" stroke="#dcdfe8"/>
    <text x="1112" y="124" fill="#5b6072" font-size="12">Revenue</text>
    <text x="1112" y="156" fill="#1a1b23" font-size="23" font-weight="700">$4.2k</text>
    <!-- Rows -->
    <rect x="990" y="186" width="208" height="112" rx="10" fill="#ffffff" stroke="#dcdfe8"/>
    <text x="1004" y="210" fill="#1a1b23" font-size="14">Keyboard</text>
    <rect x="1132" y="194" width="54" height="22" rx="11" fill="#d7efe3"/>
    <text x="1159" y="209" text-anchor="middle" fill="#177a50" font-size="12" font-weight="600">active</text>
    <rect x="990" y="223" width="208" height="1" fill="#dcdfe8"/>
    <text x="1004" y="247" fill="#1a1b23" font-size="14">Monitor</text>
    <rect x="1132" y="231" width="54" height="22" rx="11" fill="#d7efe3"/>
    <text x="1159" y="246" text-anchor="middle" fill="#177a50" font-size="12" font-weight="600">active</text>
    <rect x="990" y="261" width="208" height="1" fill="#dcdfe8"/>
    <text x="1004" y="284" fill="#1a1b23" font-size="14">Mouse</text>
    <rect x="1140" y="268" width="46" height="22" rx="11" fill="#f7ead0"/>
    <text x="1163" y="284" text-anchor="middle" fill="#9a6206" font-size="12" font-weight="600">draft</text>
  </g>
</svg>
